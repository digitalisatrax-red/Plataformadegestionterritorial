<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#005e96">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>Incendios Caldas — Campo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
:root{
  --blue:#0079c1; --blue-d:#005e96; --blue-l:#e8f3fa;
  --ink:#2b2b2b; --mute:#6a6a6a; --line:#dcdcdc; --bg:#f4f4f4; --card:#fff;
  --red:#d83020; --org:#f89927; --gray:#8c8c8c; --green:#35ac46;
  --nav:58px; --r:10px;
  --sh:0 1px 4px rgba(0,0,0,.3);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font:15px/1.35 "Avenir Next","Avenir",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
svg.i{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
#app{position:fixed;inset:0;display:flex;flex-direction:column}
#stage{position:relative;flex:1;min-height:0}
#map{position:absolute;inset:0;background:#cfd8dc;z-index:0}
.leaflet-control-attribution{font-size:9px}
.leaflet-top.leaflet-left .leaflet-control-zoom{display:none}

/* Barra superior estilo Field Maps */
#top{position:absolute;z-index:500;top:0;left:0;right:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;pointer-events:none}
#top>*{pointer-events:auto}
.bar{display:flex;align-items:center;gap:8px;background:var(--blue);color:#fff;border-radius:var(--r);padding:0 6px 0 12px;height:46px;box-shadow:var(--sh)}
.bar b{font-weight:600;white-space:nowrap}
.bar .search{flex:1;min-width:0;background:rgba(255,255,255,.18);border:0;border-radius:6px;height:32px;padding:0 10px;color:#fff;outline:0}
.bar .search::placeholder{color:rgba(255,255,255,.75)}
.chip-sync{display:flex;align-items:center;gap:5px;font-size:12px;background:rgba(0,0,0,.2);border-radius:14px;padding:4px 9px;white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:#7bd88f}.dot.off{background:#ffb199}
#chips{display:flex;gap:6px;overflow-x:auto;padding:8px 2px 4px;scrollbar-width:none}
#chips::-webkit-scrollbar{display:none}
.fchip{flex:none;display:flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:5px 11px;font-size:13px;box-shadow:var(--sh);cursor:pointer;user-select:none}
.fchip.off{opacity:.55;background:#f0f0f0}
.fchip i{width:10px;height:10px;border-radius:50%;display:block}

/* Controles flotantes */
#fabs{position:absolute;z-index:500;right:10px;bottom:16px;display:flex;flex-direction:column;gap:8px}
.fab{width:44px;height:44px;border-radius:50%;background:#fff;border:0;box-shadow:var(--sh);display:grid;place-items:center;color:var(--blue-d);cursor:pointer}
.fab:active{background:var(--blue-l)}
.fab.on{background:var(--blue);color:#fff}
#gal{position:absolute;z-index:600;right:62px;bottom:16px;background:#fff;border-radius:var(--r);box-shadow:var(--sh);padding:8px;display:none;width:236px}
#gal.show{display:block}
#gal h4{margin:2px 4px 8px;font-size:12px;text-transform:uppercase;letter-spacing:.04em;color:var(--mute)}
.bm{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.bm button{border:2px solid transparent;background:#f0f0f0;border-radius:8px;padding:0;overflow:hidden;cursor:pointer;font-size:12px}
.bm button div{height:44px}
.bm button span{display:block;padding:4px}
.bm button.sel{border-color:var(--blue)}

/* Marcadores */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);display:grid;place-items:center;border:2.5px solid #fff;box-shadow:0 1px 5px rgba(0,0,0,.5);margin:4px 0 0 2px}
.pin svg{transform:rotate(45deg);width:16px;height:16px;stroke:#fff;fill:#fff;stroke-width:1}
.p-activo{background:var(--red)}.p-controlado{background:var(--org)}.p-extinguido{background:var(--gray)}
.p-pendiente{background:#fff;border:2.5px dashed var(--red)}.p-pendiente svg{stroke:var(--red);fill:var(--red)}
.p-equipo{background:var(--blue)}
.p-sos{background:#b00020;animation:pulse 1s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 12px rgba(176,0,32,.2)}}
.firms{width:12px;height:12px;background:#ff5a00;border:1.5px solid #fff;border-radius:2px;box-shadow:0 0 0 1px rgba(0,0,0,.4)}
.me{width:16px;height:16px;border-radius:50%;background:#2a7fff;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.3),0 0 8px rgba(42,127,255,.7)}

/* Navegación inferior */
#nav{display:flex;height:calc(var(--nav) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#fff;border-top:1px solid var(--line);z-index:900;position:relative}
#nav button{flex:1;border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;color:var(--mute);position:relative;cursor:pointer}
#nav button.on{color:var(--blue)}
#nav button.main span.c{background:var(--red);color:#fff;border-radius:50%;width:44px;height:44px;display:grid;place-items:center;margin-top:-20px;box-shadow:0 2px 6px rgba(0,0,0,.4);border:3px solid #fff}
#nav button.main span.c svg{width:26px;height:26px}
.badge{position:absolute;top:5px;left:calc(50% + 6px);background:var(--red);color:#fff;border-radius:9px;font-size:10px;min-width:17px;height:17px;display:none;place-items:center;padding:0 4px}

/* Páginas y hojas */
.page{position:absolute;inset:0;background:var(--bg);z-index:700;display:none;flex-direction:column}
.page.show{display:flex}
.ph{background:var(--blue);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;display:flex;align-items:center;gap:10px;box-shadow:var(--sh)}
.ph h2{margin:0;font-size:18px;font-weight:600;flex:1}
.pb{flex:1;overflow-y:auto;padding:12px;-webkit-overflow-scrolling:touch}
.card{background:var(--card);border-radius:var(--r);box-shadow:0 1px 3px rgba(0,0,0,.15);padding:12px;margin-bottom:12px}
.card h3{margin:0 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute)}
label.f{display:block;margin:10px 0 0;font-size:13px;color:var(--mute)}
label.f input,label.f select,label.f textarea{display:block;width:100%;margin-top:4px;padding:10px;border:1px solid #bdbdbd;border-radius:6px;background:#fff;font-size:16px;color:var(--ink)}
label.f textarea{min-height:76px;resize:vertical}
label.f input:focus,label.f select:focus,label.f textarea:focus{outline:2px solid var(--blue);border-color:var(--blue)}
.row{display:flex;gap:8px}.row>*{flex:1}
.btn{border:0;border-radius:6px;padding:11px 14px;background:var(--blue);color:#fff;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:active{background:var(--blue-d)}
.btn.sec{background:#fff;color:var(--blue-d);border:1px solid var(--blue)}
.btn.red{background:var(--red)}.btn.full{width:100%}.btn[disabled]{opacity:.5}
.btn.sm{padding:7px 10px;font-size:13px}
.seg{display:flex;border:1px solid var(--blue);border-radius:6px;overflow:hidden;margin-top:4px}
.seg button{flex:1;border:0;background:#fff;color:var(--blue-d);padding:10px 4px;cursor:pointer;font-size:14px}
.seg button.on{background:var(--blue);color:#fff}
.gps{display:flex;align-items:center;gap:10px;background:var(--blue-l);border-radius:8px;padding:10px}
.gps b{display:block}.gps small{color:var(--mute)}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:8px}
.photos div{position:relative;aspect-ratio:1;border-radius:6px;overflow:hidden;background:#ddd}
.photos img{width:100%;height:100%;object-fit:cover}
.photos button{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.65);color:#fff;font-size:14px;line-height:1}
#sendbar{padding:10px 12px calc(10px);background:#fff;border-top:1px solid var(--line)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:800;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -2px 12px rgba(0,0,0,.3);max-height:72%;display:none;flex-direction:column}
.sheet.show{display:flex}
.sheet .grab{width:38px;height:4px;border-radius:2px;background:#c8c8c8;margin:8px auto 2px}
.sh-h{display:flex;align-items:flex-start;gap:8px;padding:6px 14px 8px}
.sh-h h3{margin:0;font-size:17px;flex:1}
.sh-h button{border:0;background:none;color:var(--mute);padding:4px}
.sh-b{overflow-y:auto;padding:0 14px 14px}
table.attr{width:100%;border-collapse:collapse;font-size:14px}
table.attr td{padding:7px 0;border-bottom:1px solid #eee;vertical-align:top}
table.attr td:first-child{color:var(--mute);width:38%;padding-right:8px}
.tag{display:inline-block;border-radius:10px;padding:2px 9px;font-size:12px;color:#fff;font-weight:600}
.t-activo{background:var(--red)}.t-controlado{background:var(--org)}.t-extinguido{background:var(--gray)}
.t-pendiente{background:#fff;color:var(--red);border:1px dashed var(--red)}
.t-ok{background:var(--green)}.t-warn{background:#b8860b}
.li{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.li:last-child{border:0}.li .g{flex:1;min-width:0}.li small{color:var(--mute);display:block}
.sos{width:100%;height:76px;border-radius:12px;border:0;background:#b00020;color:#fff;font-size:18px;font-weight:700;letter-spacing:.04em;position:relative;overflow:hidden;touch-action:none;user-select:none}
.sos i{position:absolute;left:0;top:0;bottom:0;width:0;background:rgba(255,255,255,.35)}
.sos span{position:relative;display:flex;align-items:center;justify-content:center;gap:8px}
.sw{position:relative;width:46px;height:26px;flex:none}
.sw input{opacity:0;width:100%;height:100%;position:absolute;margin:0}
.sw s{position:absolute;inset:0;background:#bbb;border-radius:13px;transition:.2s}
.sw s:after{content:"";position:absolute;width:20px;height:20px;border-radius:50%;background:#fff;left:3px;top:3px;transition:.2s}
.sw input:checked+s{background:var(--blue)}.sw input:checked+s:after{left:23px}
#chat{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:6px;background:#eef1f3}
.msg{max-width:82%;padding:8px 11px;border-radius:12px;background:#fff;box-shadow:0 1px 1px rgba(0,0,0,.12);align-self:flex-start;word-wrap:break-word}
.msg.mine{align-self:flex-end;background:#d9edfa}
.msg.sosm{background:#fde7ea;border:1.5px solid #b00020}
.msg small{display:block;color:var(--mute);font-size:11px;margin-top:2px}
.msg b{font-size:12px;color:var(--blue-d)}
#composer{display:flex;gap:8px;padding:8px;background:#fff;border-top:1px solid var(--line);align-items:center}
#composer input{flex:1;border:1px solid #bdbdbd;border-radius:20px;padding:10px 14px;font-size:16px}
#composer button{width:42px;height:42px;border-radius:50%;border:0;background:var(--blue);color:#fff;display:grid;place-items:center}
#composer button.sec{background:var(--blue-l);color:var(--blue-d)}
#pick{position:absolute;inset:0;z-index:650;display:none;pointer-events:none}
#pick.show{display:block}
#pick .x{position:absolute;left:50%;top:50%;width:34px;height:34px;transform:translate(-50%,-50%);}
#pick .x:before,#pick .x:after{content:"";position:absolute;background:#d83020}
#pick .x:before{left:16px;top:0;width:2px;height:34px}#pick .x:after{top:16px;left:0;height:2px;width:34px}
#pick .bt{position:absolute;left:12px;right:12px;bottom:14px;display:flex;gap:8px;pointer-events:auto}
#pick .bt .btn{flex:1}
#pick .msgp{position:absolute;top:calc(60px + env(safe-area-inset-top));left:12px;right:12px;background:rgba(0,0,0,.75);color:#fff;border-radius:8px;padding:8px 12px;text-align:center}
#toast{position:fixed;left:50%;bottom:calc(var(--nav) + 24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#323232;color:#fff;padding:10px 16px;border-radius:8px;z-index:2000;display:none;max-width:90%;text-align:center}
#lightbox{position:fixed;inset:0;background:rgba(0,0,0,.92);z-index:3000;display:none;align-items:center;justify-content:center}
#lightbox img{max-width:100%;max-height:100%}
.demo{background:#fff4ce;color:#5c4a00;border-radius:8px;padding:8px 12px;margin-bottom:12px;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:26px 12px}
.hb{border:0;background:rgba(255,255,255,.18);color:#fff;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;flex:none;cursor:pointer}
.bar>svg.i{display:none}
.p-alerta{background:#e6a100}
.t-fuente{background:#5b6b7a}.t-est{background:#fff;color:var(--ink);border:1px solid var(--line)}
.card.al:active{background:var(--blue-l)}
.cnt{display:flex;gap:8px;margin-bottom:10px}.cnt div{flex:1;background:#fff;border-radius:var(--r);padding:8px;text-align:center;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.cnt b{display:block;font-size:22px}.cnt small{color:var(--mute)}
</style>
</head>
<body>
<div id="app">
  <div id="stage">
    <div id="map"></div>

    <div id="top">
      <div class="bar">
        <svg class="i" viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg>
        <input id="q" class="search" placeholder="Buscar municipio, vereda o lat,lon" enterkeyhint="search">
        <div class="chip-sync" id="sync"><span class="dot" id="dot"></span><span id="synctxt">En línea</span></div><button class="hb" data-tab="cuenta" aria-label="Cuenta"><svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>
      </div>
      <div id="chips"></div>
    </div>

    <div id="gal"></div>
    <div id="fabs">
      <button class="fab" id="bLayers" aria-label="Capas y mapa base"><svg class="i" viewBox="0 0 24 24"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg></button>
      <button class="fab" id="bZoomIn" aria-label="Acercar"><svg class="i" viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="fab" id="bZoomOut" aria-label="Alejar"><svg class="i" viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/></svg></button>
      <button class="fab" id="bLocate" aria-label="Mi ubicación"><svg class="i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><circle cx="12" cy="12" r="8"/><line x1="12" y1="1" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="23"/><line x1="1" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="23" y2="12"/></svg></button>
    </div>

    <div id="pick"><div class="msgp">Mueve el mapa hasta centrar la cruz sobre el incendio</div><div class="x"></div>
      <div class="bt"><button class="btn sec" id="pickNo" style="background:#fff">Cancelar</button><button class="btn" id="pickOk">Confirmar ubicación</button></div></div>

    <!-- Detalle (pop-up) -->
    <div class="sheet" id="detail"><div class="grab"></div>
      <div class="sh-h"><h3 id="dTitle"></h3><button id="dClose" aria-label="Cerrar"><svg class="i" viewBox="0 0 24 24"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg></button></div>
      <div class="sh-b" id="dBody"></div></div>

    <!-- Páginas -->
    <div class="page" id="p-reportar">
      <div class="ph"><h2>Reportar incendio</h2></div>
      <div class="pb" id="repBody"></div>
      <div id="sendbar"><button class="btn red full" id="repSend"><svg class="i" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>Enviar reporte</button></div>
    </div>
    <div class="page" id="p-equipo"><div class="ph"><h2>Guardabosques</h2></div><div class="pb" id="eqBody"></div></div>
    <div class="page" id="p-alertas"><div class="ph"><h2>Alertas por verificar</h2></div><div class="pb" id="alBody"></div></div>
    <div class="page" id="p-mensajes">
      <div class="ph"><h2>Comunicación</h2></div>
      <div style="padding:8px 12px;background:#fff;border-bottom:1px solid var(--line)"><select id="canal" style="width:100%;padding:9px;border:1px solid #bdbdbd;border-radius:6px;font-size:15px"></select></div>
      <div id="chat"></div>
      <div id="composer">
        <button class="sec" id="msgLoc" aria-label="Enviar ubicación"><svg class="i" viewBox="0 0 24 24"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg></button>
        <input id="msgTxt" placeholder="Escribe un mensaje" autocomplete="off">
        <button id="msgSend" aria-label="Enviar"><svg class="i" viewBox="0 0 24 24"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg></button>
      </div>
    </div>
    <div class="page" id="p-cuenta"><div class="ph"><h2>Cuenta y sincronización</h2></div><div class="pb" id="acBody"></div></div>
  </div>

  <nav id="nav">
    <button data-tab="mapa" class="on"><svg class="i" viewBox="0 0 24 24"><polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"/><line x1="8" y1="2" x2="8" y2="18"/><line x1="16" y1="6" x2="16" y2="22"/></svg>Mapa</button>
    <button data-tab="alertas"><svg class="i" viewBox="0 0 24 24"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>Alertas<span class="badge" id="bAl"></span></button>
    <button data-tab="reportar" class="main"><span class="c"><svg class="i" viewBox="0 0 24 24"><path d="M12 2c1 4 5 6 5 11a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-4-1-6 1-10z"/></svg></span>Reportar</button>
    <button data-tab="mensajes"><svg class="i" viewBox="0 0 24 24"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>Mensajes<span class="badge" id="bMsg"></span></button>
    <button data-tab="equipo"><svg class="i" viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>Equipo</button>
  </nav>
</div>
<div id="toast"></div>
<div id="lightbox"><img alt=""></div>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
"use strict";
/* ====================== Utilidades ====================== */
const C = window.APP_CONFIG;
const ONLINE = !!(C.SUPABASE_URL && C.SUPABASE_ANON_KEY && window.supabase);
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : "id-" + Date.now() + "-" + Math.random().toString(16).slice(2));
const fmt = d => d ? new Date(d).toLocaleString("es-CO", { dateStyle: "short", timeStyle: "short" }) : "—";
const KM = (a, b, c, d) => { const r = Math.PI / 180, x = (c - a) * r, y = (d - b) * r; const h = Math.sin(x / 2) ** 2 + Math.cos(a * r) * Math.cos(c * r) * Math.sin(y / 2) ** 2; return 12742 * Math.asin(Math.sqrt(h)); };
const IC = {
  cam: '<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>',

    const r = indexedDB.open("incendios-caldas", 1);
    r.onupgradeneeded = () => { ["cola", "demo", "cache"].forEach(s => r.result.createObjectStore(s, { keyPath: "k" })); };

  return { get: (s, k) => tx(s, "readonly", st => st.get(k)), put: (s, o) => tx(s, "readwrite", st => st.put(o)), del: (s, k) => tx(s, "readwrite", st => st.delete(k)), all: s => tx(s, "readonly", st => st.getAll()) };

const DB = {
  async list(tabla, lim = 500) {
    if (!ONLINE) { return (await idb.all("demo")).filter(r => r.t === tabla).map(r => r.row); }
    try {
      const ad = ADAPT[tabla] || {};
      let q = sb.from(tabla).select("*").limit(lim);
      if (ad.order !== null) q = q.order(ad.order || "created_at", { ascending: false });
      const { data, error } = await q; if (error) throw error;
      const rows = ad.from ? data.map(ad.from) : data;
      idb.put("cache", { k: tabla, rows }); return rows;
    } catch (e) { const c = await idb.get("cache", tabla); return c ? c.rows : []; }
  },
  async insert(tabla, row) {
    if (!ONLINE) { await idb.put("demo", { k: tabla + ":" + row.id, t: tabla, row }); return; }
    const ad = ADAPT[tabla]; const { error } = await sb.from(tabla).insert(ad && ad.to ? ad.to(row) : row);
    if (error && error.code !== "23505") throw error;
  },
  async update(tabla, id, patch) {
    if (!ONLINE) { const r = await idb.get("demo", tabla + ":" + id); if (r) { Object.assign(r.row, patch); await idb.put("demo", r); } return; }
    const ad = ADAPT[tabla]; const { error } = await sb.from(tabla).update(ad && ad.patch ? ad.patch(patch) : patch).eq("id", id); if (error) throw error;
  },
  async upsertPos(row) {
    if (!ONLINE) { await idb.put("demo", { k: C.TABLA_POSICIONES + ":" + row.user_id, t: C.TABLA_POSICIONES, row }); return; }
    await sb.from(C.TABLA_POSICIONES).upsert(row);
  },
  async rpc(fn, args) {
    if (!ONLINE) return demoRpc(fn, args);
    const { error } = await sb.rpc(fn, args); if (error) throw error;
  },
  async uploadFoto(path, blob) {
    if (!ONLINE) return await blobToDataURL(blob);
    const { error } = await sb.storage.from(C.BUCKET_FOTOS).upload(path, blob, { contentType: "image/jpeg", upsert: false });
    if (error && !/exists|Duplicate/i.test(error.message)) throw error;
    return sb.storage.from(C.BUCKET_FOTOS).getPublicUrl(path).data.publicUrl;
  }
};
async function demoRpc(fn, args) {
  if (fn !== "verificar_alerta") return;
  const r = await idb.get("demo", C.TABLA_ALERTAS + ":" + args.p_id); if (!r) return; const a = r.row; let rep = a.reporte_id;
  if (args.p_resultado === "incendio_confirmado" && !rep && args.p_reporte) {
    rep = args.p_reporte.id;
    await DB.insert(C.TABLA_REPORTES, { ...args.p_reporte, created_at: new Date().toISOString(), origen: "app", estado_validacion: "validado", observaciones: "Verificado en sitio. " + (args.p_notas || ""), fotos: args.p_fotos || [], reportado_por_nombre: S.nombre });
  } else if (rep) {
    const rr = await idb.get("demo", C.TABLA_REPORTES + ":" + rep);
    if (rr) { if (args.p_resultado === "incendio_confirmado") rr.row.estado_validacion = "validado"; else if (args.p_resultado === "sin_incendio") rr.row.estado_validacion = "rechazado"; await idb.put("demo", rr); }
  }
  Object.assign(a, { estado: "verificada", resultado: args.p_resultado, notas_verificacion: args.p_notas, verificado_por_nombre: S.nombre, verificado_en: new Date().toISOString(), reporte_id: rep, fotos: (a.fotos || []).concat(args.p_fotos || []) });
  await idb.put("demo", r);
}
const blobToDataURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });

/* Cola: todo lo que el usuario envía pasa por aquí (funciona sin señal) */
async function enqueue(tabla, row, fotos = []) {
  await idb.put("cola", { k: row.id, tabla, row, fotos });
  await refreshCola(); flush();
}
async function enqueueOp(op, tabla, id, row, fotos = []) { await idb.put("cola", { k: uid(), op, tabla, id, row, fotos }); await refreshCola(); flush(); }
async function refreshCola() { S.cola = (await idb.all("cola")).length; paintSync(); }
let flushing = false, flushStart = 0;
S.lastErr = "";
const withTO = (pr, ms, label) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error("Tiempo agotado (" + label + ")")), ms))]);
const errTxt = e => (e && (e.message || e.details || e.hint)) ? String(e.message || e.details) + (e.code ? " [" + e.code + "]" : "") : String(e);
async function flush(manual) {
  if (ONLINE && !navigator.onLine) return;
  if (flushing) { if (Date.now() - flushStart < 90000) return; }  /* se destraba sola si quedó colgada */
  flushing = true; flushStart = Date.now(); let fallos = 0;
  try {
    if (ONLINE) { try { await withTO(sb.auth.getSession(), 8000, "sesión"); } catch (e) { } }
    for (const it of await idb.all("cola")) {
      try {
        const op = it.op || "insert"; const row = { ...it.row }; const urls = [];
        for (let i = 0; i < (it.fotos || []).length; i++) urls.push(await withTO(DB.uploadFoto(`${it.k}/${i + 1}.jpg`, it.fotos[i]), 60000, "foto"));
        if (op === "insert") { if (urls.length) row.fotos = urls; else if (!row.fotos) row.fotos = []; await withTO(DB.insert(it.tabla, row), 30000, "envío"); }
        else if (op === "update") { await withTO(DB.update(it.tabla, it.id, row), 30000, "envío"); }
        else if (op === "rpc") { if (urls.length) row.args.p_fotos = urls; await withTO(DB.rpc(row.fn, row.args), 30000, "envío"); }
        await idb.del("cola", it.k);
      } catch (e) { fallos++; S.lastErr = it.tabla + ": " + errTxt(e); console.warn("Reintento pendiente", it.tabla, e); }
    }
    if (!fallos) S.lastErr = "";
  } finally { flushing = false; await refreshCola(); loadAll(); if (manual) toast(S.lastErr ? "No se pudo enviar: " + S.lastErr : "Todo enviado", 6000); }
}
function paintSync() {
  const on = !ONLINE || navigator.onLine;
  $("#dot").classList.toggle("off", !on || S.cola > 0);
  $("#synctxt").textContent = !ONLINE ? "Demo" : !navigator.onLine ? "Sin señal" + (S.cola ? ` · ${S.cola}` : "") : S.cola ? (S.lastErr ? `Error · ${S.cola} (toca)` : `Enviando ${S.cola}`) : "En línea";
  if (S.tab === "cuenta" && typeof paintCuenta === "function" && !document.activeElement.matches("input,select,textarea")) paintCuenta();
}

/* Ubicación del usuario (punto azul tipo ArcGIS) */
let meMarker, meCircle, watchId, wantCenter = false;
function startGPS(center) {
  if (!navigator.geolocation) return toast("Este dispositivo no tiene GPS");
  if (center) { if (S.fix) map.setView([S.fix.lat, S.fix.lon], Math.max(map.getZoom(), 15)); else wantCenter = true; }
  if (watchId != null) return;
  watchId = navigator.geolocation.watchPosition(p => {
    S.fix = { lat: p.coords.latitude, lon: p.coords.longitude, acc: p.coords.accuracy, t: Date.now() };
    const ll = [S.fix.lat, S.fix.lon];
    if (!meMarker) { meMarker = L.marker(ll, { icon: L.divIcon({ className: "", html: '<div class="me"></div>', iconSize: [16, 16] }), interactive: false, zIndexOffset: 1000 }).addTo(map); meCircle = L.circle(ll, { radius: S.fix.acc, weight: 1, color: "#2a7fff", fillOpacity: .12, interactive: false }).addTo(map); }
    else { meMarker.setLatLng(ll); meCircle.setLatLng(ll).setRadius(S.fix.acc); }
    if (wantCenter) { map.setView(ll, Math.max(map.getZoom(), 15)); wantCenter = false; }
    if (S.tab === "reportar") { if (S.form && S.form.lat == null) { S.form.lat = S.fix.lat; S.form.lon = S.fix.lon; S.form.acc = S.fix.acc; } paintGpsBox(); }
  }, () => { toast("No se pudo obtener el GPS: permite la ubicación en el navegador"); watchId = null; }, { enableHighAccuracy: true, maximumAge: 5000, timeout: 20000 });
}
$("#bLocate").onclick = () => { startGPS(true); };

function satelite(r) {
  const t0 = new Date(r.created_at).getTime(); let best = null;
  S.firms.forEach(f => { const la = f.latitude ?? f.lat, lo = f.longitude ?? f.lon; if (la == null) return;
    const ft = new Date(f.acq_datetime || (f.acq_date ? f.acq_date + "T" + String(f.acq_time || "0000").padStart(4, "0").replace(/(\d\d)(\d\d)/, "$1:$2") + ":00Z" : 0)).getTime();
    if (Math.abs(ft - t0) > 48 * 3600e3) return; const d = KM(r.lat, r.lon, la, lo); if (d <= 1 && (!best || d < best.d)) best = { d, f }; });
  return best;
}

    ${deferredInstall ? '<button class="btn full" id="aInst">Instalar en este teléfono</button>' : '<small style="color:var(--mute)">Para instalarla: menú ⋮ de Chrome → “Instalar aplicación” (o “Añadir a pantalla de inicio”).</small>'}
    ${"Notification" in window && Notification.permission !== "granted" && isStaff() ? '<button class="btn sec full" style="margin-top:8px" id="aNot">Activar notificaciones de mensajes</button>' : ""}
    ${isStaff() ? `<label class="li" style="margin-top:6px"><span class="g">Compartir mi ubicación con el equipo</span><span class="sw"><input type="checkbox" id="aPos" ${S.compartir ? "checked" : ""}><s></s></span></label>` : ""}</div>`;
}
$("#acBody").addEventListener("click", async e => {
  const id = e.target.id;
  if (id === "aIn" || id === "aUp") {
    const email = $("#aMail").value.trim(), password = $("#aPass").value; if (!email || !password) return toast("Escribe correo y contraseña");
    const r = id === "aIn" ? await sb.auth.signInWithPassword({ email, password }) : await sb.auth.signUp({ email, password, options: { data: { nombre: email.split("@")[0] } } });
    if (r.error) return toast(r.error.message, 5000); if (id === "aUp" && !r.data.session) toast("Revisa tu correo para confirmar la cuenta", 6000);
  } else if (id === "aOut") { if (ONLINE) await sb.auth.signOut(); else { localStorage.removeItem("demoUser"); await setUser(null); } }
  else if (id === "dIn") { const u = { id: "demo-" + $("#dRol").value, nombre: $("#dNom").value || "Demo", rol: $("#dRol").value }; localStorage.setItem("demoUser", JSON.stringify(u)); await setUser(u); }
  else if (id === "aSync") { toast("Sincronizando…"); flush(true); }
  else if (id === "aClr") { if (confirm("¿Descartar los envíos pendientes? Se perderán.")) { for (const it of await idb.all("cola")) await idb.del("cola", it.k); S.lastErr = ""; await refreshCola(); } }
  else if (id === "aInst") { deferredInstall.prompt(); deferredInstall = null; }
  else if (id === "aNot") { await Notification.requestPermission(); paintCuenta(); }
});
$("#acBody").addEventListener("change", e => { if (e.target.id === "aPos") setCompartir(e.target.checked); });
async function setUser(u) {
  if (!u) { S.user = null; S.rol = "ciudadano"; S.nombre = ""; setCompartir(false); }
  else if (ONLINE) {
    S.user = u; const { data } = await sb.from(C.TABLA_PERFILES).select("*").eq("user_id", u.id).maybeSingle();
    S.rol = (data && data.rol) || "ciudadano"; S.nombre = (data && data.nombre) || (u.email || "").split("@")[0];
  } else { S.user = { id: u.id, email: "" }; S.rol = u.rol; S.nombre = u.nombre; }
  paintChips(); subscribe(); await loadAll(); go(S.tab === "cuenta" ? "cuenta" : S.tab);
  if (S.user && isStaff() && localStorage.getItem("compartir") === "1") setCompartir(true);
}

/* ====================== Carga de datos y tiempo real ====================== */
async function loadReportes() { S.reportes = await DB.list(C.TABLA_REPORTES); paintMap(); }
let loading;
async function loadAll() {
  if (loading) return; loading = true;
  try {
    await seedDemo();
    S.reportes = await DB.list(C.TABLA_REPORTES);
    S.firms = (await DB.list(C.TABLA_FIRMS, 1500).catch(() => [])) || [];
    if (isStaff()) {
      S.novedades = await DB.list(C.TABLA_NOVEDADES, 100); S.posiciones = await DB.list(C.TABLA_POSICIONES, 100);
      const prevA = new Set(S.alertas.map(a => a.id)); const al = await DB.list(C.TABLA_ALERTAS, 300);
      const nuevasA = prevA.size ? al.filter(a => !prevA.has(a.id) && a.estado === "nueva" && a.creado_por !== (S.user && S.user.id)) : []; S.alertas = al; if (nuevasA.length) notifyAlertas(nuevasA);
      S.perfiles = ONLINE ? (isTec() ? (await DB.list(C.TABLA_PERFILES, 200)).filter(p => p.rol !== "ciudadano") : []) : [{ id: "demo-guardabosque", nombre: "Demo guardabosque" }, { id: "demo-x", nombre: "Luis (guardabosque)" }];
      paintBadgeAl();
      const prev = new Set(S.mensajes.map(m => m.id)); const ms = await DB.list(C.TABLA_MENSAJES, 300);
      const nuevos = S.mensajes.length ? ms.filter(m => !prev.has(m.id)) : []; S.mensajes = ms; if (nuevos.length) notifyNew(nuevos);
    }
    paintMap(); const enForm = () => document.activeElement && ["INPUT", "TEXTAREA", "SELECT"].includes(document.activeElement.tagName);
    if (S.tab === "equipo" && !enForm() && !($("#nDesc") && $("#nDesc").value)) paintEquipo();
    if (S.tab === "alertas" && !S.alForm.open && !enForm()) paintAlertas();
    if (S.tab === "mensajes") paintChat();
    if (detailId && $("#detail").classList.contains("show")) { const y = $("#dBody").scrollTop; openReporteQuiet(detailId, y); }
  } finally { loading = false; }
}
function openReporteQuiet() { /* no reabrir para no mover el mapa mientras se lee */ }
let rt, rtT;
function subscribe() {
  if (!ONLINE) return; if (rt) sb.removeChannel(rt);
  rt = sb.channel("campo").on("postgres_changes", { event: "*", schema: "public" }, () => { clearTimeout(rtT); rtT = setTimeout(loadAll, 600); }).subscribe();
}
setInterval(() => { if (!document.hidden) { flush(); loadAll(); } }, 30000);
document.addEventListener("visibilitychange", () => { if (!document.hidden) { flush(); loadAll(); } });

/* Datos de ejemplo del modo demo */
async function seedDemo() {
  if (ONLINE || (await idb.get("cache", "seeded"))) return; await idb.put("cache", { k: "seeded" });
  const h = n => new Date(Date.now() - n * 3600e3).toISOString();
  const R = (lat, lon, mun, ver, est, val, area, hrs, cob) => ({ id: uid(), created_at: h(hrs), lat, lon, municipio: mun, vereda: ver, estado: est, estado_validacion: val, area_ha: area, cobertura: cob, causa: "Desconocida", origen: "app", observaciones: "Registro de ejemplo", fotos: [], reportado_por_nombre: "Demo" });
  for (const r of [R(5.0689, -75.5174, "Manizales", "El Águila", "activo", "validado", 3.5, 2, "Pastos"), R(5.0334, -75.4777, "Villamaría", "Gallinazo", "controlado", "validado", 1.2, 20, "Rastrojo / matorral"), R(5.2635, -75.4551, "Aguadas", "La Cabaña", "activo", "pendiente", 6, 1, "Bosque natural"), R(5.4167, -75.4667, "Salamina", "Arrayanal", "extinguido", "validado", .8, 60, "Cultivo")])
    await idb.put("demo", { k: C.TABLA_REPORTES + ":" + r.id, t: C.TABLA_REPORTES, row: r });
  const pend = (await idb.all("demo")).find(x => x.t === C.TABLA_REPORTES && x.row.estado_validacion === "pendiente");
  const A = o => ({ id: uid(), estado: "nueva", prioridad: "media", created_at: h(1), fotos: [], ...o });
  for (const a of [A({ fuente: "firms", titulo: "Detección satelital VIIRS NOAA-20", descripcion: "Punto de calor sin reporte en 1 km y 48 h", lat: 5.3012, lon: -75.2411, municipio: "Pensilvania", prioridad: "alta", created_at: h(2) }),
    A({ fuente: "ideam", titulo: "Amenaza ALTA de incendios de la cobertura vegetal", descripcion: "Pronóstico IDEAM para el municipio", municipio: "Riosucio", lat: null, lon: null, created_at: h(6) }),
    A({ fuente: "ciudadano", titulo: "Reporte por verificar: Aguadas", lat: pend.row.lat, lon: pend.row.lon, municipio: "Aguadas", vereda: "La Cabaña", prioridad: "alta", reporte_id: pend.row.id })])
    await idb.put("demo", { k: C.TABLA_ALERTAS + ":" + a.id, t: C.TABLA_ALERTAS, row: a });
  const g = { id: uid(), created_at: h(3), canal: "general", autor_id: "demo-x", autor_nombre: "Luis (guardabosque)", tipo: "texto", texto: "Humo visible hacia la vereda El Águila, voy en camino.", lat: null, lon: null };
  await idb.put("demo", { k: C.TABLA_MENSAJES + ":" + g.id, t: C.TABLA_MENSAJES, row: g });
  const n = { id: uid(), created_at: h(5), tipo: "Ronda / recorrido", prioridad: "media", descripcion: "Recorrido sector alto sin novedades.", lat: 5.07, lon: -75.45, autor_nombre: "Luis (guardabosque)", fotos: [] };
  await idb.put("demo", { k: C.TABLA_NOVEDADES + ":" + n.id, t: C.TABLA_NOVEDADES, row: n });
  const p = { user_id: "demo-x", nombre: "Luis (guardabosque)", lat: 5.075, lon: -75.49, precision: 12, updated_at: h(.1) };
  await idb.put("demo", { k: C.TABLA_POSICIONES + ":" + p.user_id, t: C.TABLA_POSICIONES, row: p });
}

/* ====================== Navegación ====================== */
function go(tab) {
  if (S.picking && tab !== "mapa" && tab !== "reportar" && tab !== "alertas") return;
  S.tab = tab; closeDetail();
  $$("#nav button").forEach(b => b.classList.toggle("on", b.dataset.tab === tab));
  $$(".page").forEach(p => p.classList.toggle("show", p.id === "p-" + tab));
  $("#top").style.display = tab === "mapa" ? "" : "none"; $("#fabs").style.display = tab === "mapa" ? "" : "none";
  if (tab === "reportar") { paintReporte(); if (!S.form.lat && S.fix) { S.form.lat = S.fix.lat; S.form.lon = S.fix.lon; S.form.acc = S.fix.acc; paintGpsBox(); } startGPS(false); }
  if (tab === "alertas") paintAlertas(); if (tab === "equipo") paintEquipo(); if (tab === "mensajes") { paintChat(); } if (tab === "cuenta") paintCuenta();
  if (tab === "mapa") setTimeout(() => map.invalidateSize(), 50);
}
$("#nav").addEventListener("click", e => { const b = e.target.closest("[data-tab]"); if (b) { if (S.picking) { $("#pick").classList.remove("show"); S.picking = false; } go(b.dataset.tab); } });
$("#p-mensajes").addEventListener("click", e => { const b = e.target.closest("[data-go]"); if (b) go(b.dataset.go); });

/* ====================== Arranque ====================== */
(async function init() {
  $$(".ph").forEach(h => { if (!h.closest("#p-cuenta")) h.insertAdjacentHTML("beforeend", '<button class="hb" data-tab="cuenta" aria-label="Cuenta"><svg class="i" viewBox="0 0 24 24"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg></button>'); });
  document.addEventListener("click", e => { const h = e.target.closest(".hb"); if (h) { if (S.picking) { $("#pick").classList.remove("show"); S.picking = false; } go("cuenta"); } });
  S.form = newForm(); setBase(baseKey); paintGallery(); paintChips(); paintSync(); await refreshCola();
  if ("serviceWorker" in navigator && location.protocol.startsWith("http")) navigator.serviceWorker.register("sw.js").catch(() => { });
  if (ONLINE) {
    sb.auth.onAuthStateChange((ev, session) => { if (ev === "SIGNED_IN" || ev === "SIGNED_OUT" || ev === "INITIAL_SESSION") setTimeout(async () => { await setUser(session ? session.user : null); flush(); }, 0); });
  } else {
    let u = null; try { u = JSON.parse(localStorage.getItem("demoUser")); } catch { } await setUser(u);
  }
  loadAll(); flush(); startGPS(false);
})();
</script>
