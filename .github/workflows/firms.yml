name: Actualizar puntos de calor (FIRMS)
on:
  schedule:
    - cron: '17 */3 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  firms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python herramientas/actualizar_firms.py
      - name: Guardar cambios
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add data/firms_caldas.json
          git diff --cached --quiet || (git commit -m "Puntos de calor FIRMS (actualización automática)" && git push)
